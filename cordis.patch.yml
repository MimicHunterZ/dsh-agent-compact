# @mimichunterz/agent-compact bundle layer: registers the context compression tools at the
# host level (visible to every session, like the built-in bash/fs tools).
#
# Installed with:  dsh plugin --profile web add @mimichunterz/agent-compact
# (or `add ./agent-compact` from a checkout; see docs/user/develop/basic/publish.md)
#
# Optional: pass configuration through this row:
#   config:
#     autoArchive: true
#     maxTokens: 16384
#
# For mount-time engine optimization of a specific preset (so automatic
# pressure/overflow compaction is optimized even before the first tool use),
# replace `compaction-basic` inside that preset's `compaction` isolate realm
# with:  name: '@mimichunterz/agent-compact/engine'
- insert:
    - id: tool-context-compression
      name: '@mimichunterz/agent-compact'
